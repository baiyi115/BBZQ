name: Sync Upstream

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Restore conflict state
        uses: actions/cache/restore@v4
        with:
          path: .sync-state
          key: sync-state-${{ github.run_id }}
          restore-keys: sync-state-

      - name: Merge upstream master
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/HSSkyBoy/BBZQ.git
          git fetch --no-tags upstream master
          upstream_sha=$(git rev-parse upstream/master)
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "status=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f .sync-state/conflict ] && [ "$(<.sync-state/conflict)" = "$upstream_sha" ]; then
            echo "::warning::上游 $upstream_sha 仍与本地提交冲突，跳过本次同步"
            echo "上游 \`$upstream_sha\` 仍与本地提交冲突，已跳过本次同步。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          rm -f .sync-state/conflict
          if ! git merge --no-edit upstream/master; then
            git merge --abort
            mkdir -p .sync-state
            echo "$upstream_sha" > .sync-state/conflict
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            {
              echo "### 上游同步失败"
              echo ""
              echo "上游 \`$upstream_sha\` 与本地提交冲突，自动合并已中止。"
              echo "本地执行 \`git fetch upstream && git merge upstream/master\` 解决后推送 master。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "status=merged" >> "$GITHUB_OUTPUT"

      - name: Save conflict state
        if: failure() && steps.merge.outputs.status == 'conflict'
        uses: actions/cache/save@v4
        with:
          path: .sync-state
          key: sync-state-${{ github.run_id }}

      - name: Set up JDK
        if: steps.merge.outputs.status == 'merged'
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        if: steps.merge.outputs.status == 'merged'
        uses: android-actions/setup-android@v4.0.1
        with:
          cmdline-tools-version: 14742923
          packages: ''

      - name: Install SDK 37
        if: steps.merge.outputs.status == 'merged'
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Verify compile
        if: steps.merge.outputs.status == 'merged'
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:compileReleaseKotlin

      - name: Push master
        id: push
        if: steps.merge.outputs.status == 'merged'
        run: |
          git push origin HEAD:master
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Report unsuccessful sync
        if: failure() && steps.merge.outcome == 'success'
        run: echo "上游已合并，但编译校验或推送失败，未完成同步。" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Build release APK
    needs: sync
    if: needs.sync.outputs.pushed == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: master
    secrets: inherit
